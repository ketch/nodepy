name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, the version used for development, and the newest.
        # actions/setup-python has no Python 3.9 build for Ubuntu releases after 24.04.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install nodepy and test dependencies
        run: |
          python -m pip install --upgrade pip
          # networkx and scipy are optional dependencies used by some doctests
          # and example notebooks; ipywidgets is used by the notebooks.
          python -m pip install . nbformat nbclient ipykernel ipywidgets networkx scipy

      - name: Run doctests, unit tests and example notebooks
        run: python tests.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Keep in step with build.tools.python in .readthedocs.yml.
          python-version: "3.13"
          cache: pip

      - name: Install nodepy and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r doc/requirements.txt

      - name: Build HTML documentation (warnings are errors)
        run: python -m sphinx -b html -W --keep-going doc doc/_build/html
