name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, the version used for development, and the newest.
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install nodepy and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run doctests, unit tests and example notebooks
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      # Coverage is uploaded from one job only.  The token is the repository
      # secret CODECOV_TOKEN, copied from the repository's page on codecov.io.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Keep in step with build.tools.python in .readthedocs.yml.
          python-version: "3.13"
          cache: pip

      - name: Install nodepy and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r doc/requirements.txt

      - name: Build HTML documentation (warnings are errors)
        run: python -m sphinx -b html -W --keep-going doc doc/_build/html
